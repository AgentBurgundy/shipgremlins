services:
  hub:
    build: .
    image: shipgremlins:local
    command: ["serve", "--host", "0.0.0.0", "--port", "4310"]
    ports:
      - "127.0.0.1:4310:4310"
    volumes:
      - shipgremlins-data:/data:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  cli:
    profiles: ["tools"]
    build: .
    image: shipgremlins:local
    command: ["setup", "--check"]
    volumes:
      - shipgremlins-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  shipgremlins-data:
