name: hub-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node --test slack-app/oauth.test.mjs
      - run: node --test oauth-app/oauth.test.mjs
      - run: npx tsx src/cli.ts validate
      - run: npx tsx src/cli.ts crons --check

  global-install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:package
      - run: npm test -- src/commands/dashboard src/commands/update.test.ts src/commands/doctor.local.test.ts src/commands/signinCode.test.ts src/projectCapabilities.test.ts src/hosting src/setup/connections.test.ts src/setup/claudeToken.test.ts src/setup/configEditor.test.ts src/setup/openFolder.test.ts src/setup/runtime.test.ts src/setup/linearProvisioning.test.ts src/setup/pmBrief.test.ts src/setup/project-workspace.test.ts src/setup/pmReadiness.test.ts src/setup/job-output.test.ts src/setup/pm-linear-selection.test.ts src/pmPlanner src/pmKnowledge src/oauthConnection src/update src/localRunners src/storage src/slack
